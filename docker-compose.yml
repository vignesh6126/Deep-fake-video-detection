services:
  backend:
    build: ./backend
    container_name: deepfake-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - FLASK_ENV=production
    restart: always

  frontend:
    build: ./frontend
    container_name: deepfake-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
