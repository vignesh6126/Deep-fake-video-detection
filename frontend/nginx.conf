server {
  listen 80;
  server_name localhost;

  # ✅ Increase upload limit
  client_max_body_size 200M;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }

  # Optional: allow API uploads to backend
  location /analyze {
    proxy_pass http://backend-service:8000;
  }
}
