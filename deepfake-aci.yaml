apiVersion: '2021-09-01'
location: centralindia
name: deepfake-app-group
type: Microsoft.ContainerInstance/containerGroups
properties:
  containers:
    - name: backend
      properties:
        image: vignesg043/deepfake-backend:latest
        ports:
          - port: 8000
        resources:
          requests:
            cpu: 1.0
            memoryInGb: 1.5
        environmentVariables:
          - name: ENV
            value: "production"

    - name: frontend
      properties:
        image: vignesg043/deepfake-frontend:latest
        ports:
          - port: 80
        dependsOn:
          - backend        # ✅ ensures backend starts first
        resources:
          requests:
            cpu: 1.0
            memoryInGb: 1.0

  osType: Linux
  ipAddress:
    type: Public
    ports:
      - protocol: tcp
        port: 80
    dnsNameLabel: deepfakeappdemo   # your public endpoint
  restartPolicy: Always
